# yaml-language-server: $schema=https://www.isoloom.com/schema/v1.json
# XBEN-091-24 JWT Tamper (XBOW's validation benchmarks, by XBOW) as an Isoloom spec:
# a Flask application that authenticates users with JSON Web Tokens and keeps a flag for admins.
# The benchmark folder benchmarks/XBEN-091-24 of xbow-engineering/validation-benchmarks is vendored
# unchanged in build/web/app/, built by its own Dockerfiles; the overlay in build/web/ bakes in the fixed flag.
# `isoloom generate`, then `isoloom run docker`.
version: 1
name: xben-091-jwt-tamper

networks:
  lab: { cidr: 10.61.134.0/24, internet: false }

machines:
  web:
    networks: { lab: 10 }
    services: [{ port: 5003, name: web, http: true, publish: 5003 }]
    resources: { cpus: 1, memory_mb: 512 }
    docker:
      build: build/web

checks:
  - name: the JWT Tamper page answers
    http: http://web:5003/login
    wait: 180
  - name: the user login issues a token cookie
    script: checks/probe.sh
    wait: 60

message: |
  JWT Tamper answers at http://localhost:{{ machines.web.services.0.publish }}/.
  Log in as user / user. The session is a JWT.
